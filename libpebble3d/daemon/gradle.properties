# The composite build configures the whole upstream mobileapp build (KMP + Android), so give the
# Gradle and Kotlin daemons plenty of headroom — same as the mobileapp root.
org.gradle.jvmargs=-Xmx12g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx8g
kotlin.code.style=official
