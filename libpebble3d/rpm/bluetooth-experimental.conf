# Installed by libpebble3d.
#
# Exposes bluetoothd's experimental D-Bus APIs. Pebble advertisements wrongly
# claim BR/EDR support, so on BlueZ < 5.79 (no PreferredBearer property) plain
# Device1.Connect pages the nonexistent classic radio; the experimental
# Adapter1.ConnectDevice is the only call that connects LE explicitly.
#
# TRACING is expanded verbatim in bluetooth.service's ExecStart. If the
# bluez5-tracing package is installed, its /etc/tracing/bluez/bluez.tracing
# EnvironmentFile overrides this — add -E there instead.
[Service]
Environment=TRACING=-E
